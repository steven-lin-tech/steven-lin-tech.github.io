name: Deploy Static Site

on:
  push:
    branches:
      - main  # 每次推到 main 都會觸發部署

permissions:
  contents: write  # 讓 GitHub Actions 有權限建立/更新 gh-pages 分支

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup CNAME
        run: echo "stevencv.com" > CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./             # 網站內容在根目錄
          publish_branch: gh-pages    # ✅ 重要：發佈到 gh-pages 分支
          cname: stevencv.com
