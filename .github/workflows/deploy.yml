name: Deploy Static Site

on:
  push:
    branches:
      - main

permissions:
  contents: write      # ✅ 給機器人寫入權限
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set custom domain
        run: echo "stevencv.com" > CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}   # ✅ 用 GitHub 內建權杖，不需自己建立
          publish_dir: ./
          cname: stevencv.com

